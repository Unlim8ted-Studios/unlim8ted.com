    <style>
        /* Navigation Bar Styles */
        .navbar {
            display: flex;
            justify-content: center;
            background-color: #333333d0;
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 3;
        }

        .nav-links {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
        }

        .nav-item {
            position: relative;
        }

        .nav-item a {
            display: block;
            color: white;
            padding: 14px 20px;
            text-decoration: none;
            text-align: center;
        }

        .nav-item a:hover {
            background-color: #15131f;
            color: rgb(51, 207, 103);
        }

        .dropdown-content {
            display: none;
            position: absolute;
            background-color: #f9f9f9;
            min-width: 160px;
            box-shadow: 0px 8px 16px 0px rgba(0, 0, 0, 0.2);
            z-index: 3;
        }

        .dropdown-content a {
            color: black;
            padding: 12px 16px;
            text-decoration: none;
            display: block;
            text-align: left;
        }

        .dropdown-content a:hover {
            background-color: #1c1d38;
        }

        .dropdown:hover .dropdown-content {
            display: block;
            z-index: 3;
        }

        .dropdown-content {
            display: none;
            position: absolute;
            background-color: #251f1f;
            box-shadow: 0px 8px 16px rgba(0, 0, 0, 0.2);
        }

        .dropdown:hover .dropdown-content {
            display: block;
        }

        .dropdown-content a {
            color: rgb(255, 255, 255);
            text-decoration: none;
            padding: 12px 16px;
            display: block;
        }

        .dropdown-content a:hover {
            background-color: #2d2849;
        }

        .navbar-toggle {
            display: none;
            background-color: #333;
            color: white;
            padding: 14px 20px;
            border: none;
            cursor: pointer;
            font-size: 18px;
        }

        /* Responsive styles */
        @media (max-width: 768px) {
            .nav-links {
                flex-direction: column;
                display: none;
            }

            .nav-links.show {
                display: flex;
            }

            .navbar-toggle {
                display: block;
            }
        }
    </style>

    <style>
        /* logo */
        .logo {
            position: absolute;
            z-index: 1;
            top: 5%;
            /* Adjust top position relative to viewport height */

            /* Maintain aspect ratio */
        }

            .logo img {

    <style>
        /* General body styles */
        body {

        }

        }

        .product-box img {
            max-width: 100%;
            height: auto;
            border-radius: 10px;
            margin-bottom: 10px;
        }

        .product-box h2 {
            font-size: 1.5rem;
            color: #00ffc6;
        }

        .product-box p {
            font-size: 1rem;
            color: #cccccc;
        }

        a {
            color: #00ffc6;
            text-decoration: none;
        }

        a:hover {
            text-shadow: 0 0 10px #00ffc6;
        }



        .product-category,
        .item-category {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .product-box,
        .item-box {
            background-color: #ffffff;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            transition: transform 0.3s ease;
            width: 250px;
            text-align: center;
            text-decoration: none;
            color: inherit;
        }

        .product-box:hover,
        .item-box:hover {
            transform: scale(1.05);
        }

        .product-box img,
        .item-box img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }

        .product-box h2,
        .item-box h3 {
            color: #000000;
            font-size: 1.5em;
            margin: 10px 0;
        }

        .product-box p,
        .item-box p {
            font-size: 1em;
            color: #666;
            padding: 0 10px 20px;
        }

        .search-bar {
            margin: 20px 0;
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        .search-bar input[type="text"],
        .search-bar select {
            padding: 10px;
            font-size: 1em;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        .meatballLogo { height: 200px; display: grid; place-items: center; background: #191410; border-radius: 10px; --meatball-size: 140px; }
        .unavailable { opacity: .7; }
        .unavailable:hover { transform: none; }
        .completed:hover { transform: none; }
        /* Completed projects use the same muted, unavailable-card treatment. */
        .item-box.unavailable.completed .item-artwork {
            position: relative;
            filter: grayscale(0.75);
        }
        .item-box.unavailable.completed .item-artwork::after {
            content: "";
            position: absolute;
            inset: 0;
            background: rgba(170, 170, 170, 0.22);
            pointer-events: none;
        }
        .item-artwork {
            width: 100%;
            height: 200px;
            display: block;
            overflow: hidden;
            border-radius: 10px 10px 0 0;
        }
        .item-artwork svg {
            display: block;
            width: 100%;
            height: 100%;
        }
        .item-box .project-status {
            display: inline-block;
            margin: 1px 0 20px;
            padding: 7px 13px;
            border-radius: 20px;
            background: #e5e5e5;
            color: #626262;
            font-size: .87rem;
            font-weight: 700;
        }
